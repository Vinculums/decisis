[project]
name = "decisis"
version = "0.3.1"
description = "Stand by what was decided: join a team's decisions with code and outside facts in a throwaway Relate graph, and keep only verified findings. Works offline; connects to Vinc when you configure it."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["relate-db==1.0.2", "PyYAML>=6.0.1"]
keywords = ["decisions", "knowledge-graph", "cypher", "relate", "dependency-audit", "impact-analysis", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/Vinculums/decisis"
Documentation = "https://github.com/Vinculums/decisis#readme"
Issues = "https://github.com/Vinculums/decisis/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]
mcp = ["mcp>=2.2,<3", "jsonschema>=4.20,<5"]

[project.scripts]
decisis = "decisis.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "decisis", "decisis.inventory", "decisis.queries", "decisis.bench",
    "decisis.fixtures", "decisis.fixtures.audit", "decisis.fixtures.compare", "decisis.fixtures.demo", "decisis.fixtures.impact",
    "decisis.fixtures.inventory", "decisis.fixtures.inventory.go",
]

[tool.setuptools.package-dir]
"" = "src"
"decisis.fixtures" = "fixtures"
"decisis.bench" = "bench"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: runs for minutes; skipped unless DECISIS_SLOW=1 or -m slow selects it"]

[tool.setuptools.package-data]
decisis = ["queries/*.cypher"]
"decisis.fixtures" = ["*.json"]
"decisis.fixtures.audit" = ["*.json"]
"decisis.fixtures.compare" = ["*.json"]
"decisis.fixtures.demo" = ["*.json"]
"decisis.fixtures.impact" = ["*.json"]
"decisis.fixtures.inventory" = ["*.json", "*.lock"]
"decisis.fixtures.inventory.go" = ["go.mod", "go.sum"]
"decisis.bench" = ["tasks.json"]
