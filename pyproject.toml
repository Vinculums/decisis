[project]
name = "vinc-relate"
version = "0.0.1"
description = "Check out task-relevant knowledge from Vinc, reason over it with external data in an ephemeral Relate graph, commit only verified findings."
requires-python = ">=3.11"
dependencies = ["relate-db==1.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vinc-relate = "vinc_relate.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
