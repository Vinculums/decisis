[project]
name = "decisis"
version = "0.1.0"
description = "Stand by what was decided: join a team's decisions with code and outside facts in a throwaway Relate graph, and keep only verified findings. Works offline; connects to Vinc when you configure it."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["relate-db==1.0.2"]

[project.urls]
Repository = "https://github.com/Vinculums/decisis"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
decisis = "decisis.cli:main"
vinc-relate = "decisis.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "decisis", "decisis.queries", "decisis.bench", "vinc_relate",
    "decisis.fixtures", "decisis.fixtures.audit", "decisis.fixtures.compare", "decisis.fixtures.demo", "decisis.fixtures.impact",
]

[tool.setuptools.package-dir]
"" = "src"
"decisis.fixtures" = "fixtures"
"decisis.bench" = "bench"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
decisis = ["queries/*.cypher"]
"decisis.fixtures" = ["*.json"]
"decisis.fixtures.audit" = ["*.json"]
"decisis.fixtures.compare" = ["*.json"]
"decisis.fixtures.demo" = ["*.json"]
"decisis.fixtures.impact" = ["*.json"]
"decisis.bench" = ["tasks.json"]
