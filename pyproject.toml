[project]
name = "decisis"
version = "0.1.0"
description = "Stand by what was decided: join a team's decisions with code and outside facts in a throwaway Relate graph, and keep only verified findings. Works offline; connects to Vinc when you configure it."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["relate-db==1.0.2"]

[project.urls]
Repository = "https://github.com/Vinculums/decisis"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
decisis = "decisis.cli:main"
vinc-relate = "decisis.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
decisis = ["queries/*.cypher"]
