name: decisis check
description: Comment the decisions a pull request touches, the review and import rules it breaks, and a path graph.
author: Vinculums
branding:
  icon: git-pull-request
  color: blue

inputs:
  snapshot:
    description: A decisis snapshot (JSON), relative to the workspace. Give this or init.
    required: false
    default: ""
  init:
    description: true builds the snapshot from the repository's ADRs, CODEOWNERS and postmortems with decisis init.
    required: false
    default: "false"
  decisions-from:
    description: base (the default) reads the decisions, the snapshot file or what init reads, from the pull request's base commit; head reads them from the checkout, so the pull request can change the decisions it is judged by.
    required: false
    default: base
  github-token:
    description: Reads the reviews and writes the comment; needs pull-requests write and contents read.
    required: false
    default: ${{ github.token }}
  inventory:
    description: A lockfile or SBOM relative to the workspace, several one per line, or auto for the lockfiles and workflows in the root of working-directory. When given, decisis audit runs on each.
    required: false
    default: ""
  osv-cache:
    description: An OSV cache file for the audit; without it the audit asks api.osv.dev.
    required: false
    default: ""
  repo:
    description: The repository name the snapshot's code_ref values use (default for the audit, the repository's name).
    required: false
    default: ""
  working-directory:
    description: The repository the changed files are read from, relative to the workspace.
    required: false
    default: "."
  fail-on-violation:
    description: true fails the step when check or audit finds a violation. A waived finding is not a violation.
    required: false
    default: "false"
  fail-on-unresolved:
    description: true fails the step when check has a result that cannot be judged, an audit has an unresolved finding or package, or a decision file was not read. A waived finding is never unresolved.
    required: false
    default: "false"
  today:
    description: The UTC date, YYYY-MM-DD, that waivers are judged on. Empty uses today's UTC date.
    required: false
    default: ""
  sarif:
    description: true also writes the check and audit results as SARIF 2.1.0 to decisis.sarif in the workspace, sets the sarif-file output, and uploads the file to GitHub code scanning. The job needs security-events write. A pull request from a fork cannot upload. The comment and the exit code do not change.
    required: false
    default: "false"
  decisis-version:
    description: A decisis version to install from PyPI. Empty installs decisis from the action's own checkout, which is the release the action ref names.
    required: false
    default: ""
  comment-author:
    description: The login whose marked comment is updated; change it when github-token is not the workflow token.
    required: false
    default: github-actions[bot]
  python-version:
    description: The Python that runs decisis.
    required: false
    default: "3.12"

outputs:
  violations:
    description: The number of check violations plus the audit violations of every inventory; waived findings are not counted.
    value: ${{ steps.check.outputs.violations }}
  unresolved:
    description: The number of check results that cannot be judged, unresolved audit findings and packages of every inventory, and decision files not read.
    value: ${{ steps.check.outputs.unresolved }}
  comment-url:
    description: The comment's URL, empty when the result went only to the job summary.
    value: ${{ steps.check.outputs.comment-url }}
  sarif-file:
    description: The absolute path of decisis.sarif when sarif is true, else empty.
    value: ${{ steps.check.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      id: python
      with:
        python-version: ${{ inputs.python-version }}
        update-environment: false
    - name: Install decisis
      id: install
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        DECISIS_VERSION: ${{ inputs.decisis-version }}
        ACTION_PATH: ${{ github.action_path }}
        VENV: ${{ runner.temp }}/decisis-venv
      run: |
        set -euo pipefail
        if [ -n "$DECISIS_VERSION" ]; then
          if ! [[ "$DECISIS_VERSION" =~ ^[0-9][0-9A-Za-z.+!-]*$ ]]; then
            echo "decisis-version must be a version such as 0.2.0" >&2
            exit 1
          fi
          source="decisis==$DECISIS_VERSION"
        else
          source="$ACTION_PATH"
        fi
        "$PYTHON" -I -m venv "$VENV"
        if [ -x "$VENV/bin/python" ]; then py="$VENV/bin/python"; else py="$VENV/Scripts/python.exe"; fi
        "$py" -I -m pip install --disable-pip-version-check -q "$source"
        echo "python=$py" >> "$GITHUB_OUTPUT"
    - name: Check the pull request
      id: check
      shell: bash
      env:
        PY: ${{ steps.install.outputs.python }}
        DECISIS_SNAPSHOT: ${{ inputs.snapshot }}
        DECISIS_INIT: ${{ inputs.init }}
        DECISIS_DECISIONS_FROM: ${{ inputs.decisions-from }}
        DECISIS_INVENTORY: ${{ inputs.inventory }}
        DECISIS_OSV_CACHE: ${{ inputs.osv-cache }}
        DECISIS_REPO: ${{ inputs.repo }}
        DECISIS_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        DECISIS_FAIL_ON_VIOLATION: ${{ inputs.fail-on-violation }}
        DECISIS_FAIL_ON_UNRESOLVED: ${{ inputs.fail-on-unresolved }}
        DECISIS_TODAY: ${{ inputs.today }}
        DECISIS_SARIF: ${{ inputs.sarif }}
        DECISIS_COMMENT_AUTHOR: ${{ inputs.comment-author }}
        DECISIS_TOKEN: ${{ inputs.github-token }}
      run: '"$PY" -I -m decisis.action'
    - name: Upload the SARIF file
      if: ${{ !cancelled() && steps.check.outputs.sarif-file != '' && github.event.pull_request.head.repo.full_name == github.repository }}
      uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
      with:
        sarif_file: ${{ steps.check.outputs.sarif-file }}
