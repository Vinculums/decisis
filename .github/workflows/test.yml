name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --disable-pip-version-check -q -e ".[dev,mcp]"
      - name: Tests with the network blocked
        env:
          HTTPS_PROXY: http://127.0.0.1:9
          HTTP_PROXY: http://127.0.0.1:9
          NO_PROXY: ""
        run: python -m pytest -q -p no:cacheprovider

  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the sdist and the wheel
        run: |
          python -m pip install --disable-pip-version-check -q build
          python -m build
      - name: The wheel runs the demo and the comparison outside the repository
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --disable-pip-version-check -q dist/*.whl
          cd /tmp
          /tmp/check/bin/decisis demo --out /tmp/demo-out
          /tmp/check/bin/decisis compare > /tmp/compare.md
          /tmp/check/bin/vinc-relate --help > /dev/null
