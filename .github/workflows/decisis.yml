name: decisis

on:
  pull_request:

permissions: {}

concurrency:
  group: decisis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        with:
          snapshot: fixtures/action/vinc.json
          inventory: fixtures/audit/demo-lockfile.json
          osv-cache: fixtures/audit/osv-cache.json
          repo: Demo
          sarif: true
